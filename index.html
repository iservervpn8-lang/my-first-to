<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BM — Beyond Mastery</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

:root{
  --bg:#060910;
  --card:#0d131d;
  --card2:#111a26;
  --border:#202c3b;
  --text:#f4f7fb;
  --muted:#7f8da1;
  --blue:#4b9cff;
  --blue2:#2368ff;
  --green:#35d49a;
  --yellow:#ffc857;
  --purple:#9d7cff;
  --red:#ff6175;
}

body{
  background:
    radial-gradient(circle at 10% 0%,rgba(35,104,255,.12),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(157,124,255,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= TOPBAR ================= */

.topbar{
  height:70px;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  background:rgba(6,9,16,.85);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:900;
  background:linear-gradient(145deg,#173b72,#09172d);
  border:1px solid rgba(75,156,255,.55);
  box-shadow:0 0 25px rgba(75,156,255,.15);
}

.brand-text{
  font-weight:800;
  letter-spacing:1px;
}

.brand-text small{
  display:block;
  color:var(--muted);
  font-size:8px;
  letter-spacing:2px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  font-size:18px;
}

/* ================= MAIN ================= */

.main{
  width:min(1200px,94%);
  margin:auto;
  padding:28px 0 80px;
}

.hero{
  padding:25px;
  border:1px solid var(--border);
  border-radius:24px;
  background:
    linear-gradient(135deg,rgba(75,156,255,.10),rgba(157,124,255,.04)),
    var(--card);
  margin-bottom:25px;
}

.hero h1{
  font-size:31px;
}

.hero h1 span{
  color:var(--blue);
}

.hero p{
  color:var(--muted);
  margin-top:7px;
  line-height:1.6;
}

/* ================= ORBIT ================= */

.orbit-header{
  text-align:center;
  margin:35px 0 15px;
}

.orbit-header h2{
  font-size:25px;
}

.orbit-header p{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.orbit{
  width:min(720px,96vw);
  height:min(720px,96vw);
  margin:10px auto 45px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(75,156,255,.12);
  pointer-events:none;
}

.ring.one{
  width:58%;
  height:58%;
}

.ring.two{
  width:80%;
  height:80%;
}

.ring.three{
  width:96%;
  height:96%;
  border-style:dashed;
  opacity:.4;
}

/* center */

.core{
  width:185px;
  height:185px;
  position:relative;
  z-index:10;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  background:
    radial-gradient(circle at 35% 25%,#1b365b,#0c131e 62%);

  border:1px solid rgba(75,156,255,.65);

  box-shadow:
    0 0 0 9px rgba(75,156,255,.025),
    0 0 70px rgba(75,156,255,.17),
    inset 0 0 35px rgba(75,156,255,.08);
}

.core-logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:4px;
}

.core-name{
  color:var(--muted);
  font-size:8px;
  letter-spacing:2px;
  margin-top:5px;
}

.core-level{
  margin-top:12px;
  font-size:10px;
  color:#8bb8ff;
}

/* orbit cards */

.orbit-card{
  position:absolute;
  width:145px;
  height:145px;
  z-index:20;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  background:
    radial-gradient(circle at 35% 20%,#182535,#0a1018);

  border:1px solid var(--border);
  color:white;

  transition:.25s;
}

.orbit-card:hover{
  transform:scale(1.09);
  border-color:rgba(75,156,255,.7);
  box-shadow:0 0 40px rgba(75,156,255,.14);
}

.orbit-card .icon{
  font-size:29px;
  margin-bottom:6px;
}

.orbit-card strong{
  font-size:11px;
  letter-spacing:.7px;
}

.orbit-card span{
  color:var(--muted);
  font-size:8px;
  margin-top:5px;
}

.pom{
  bottom:1%;
  left:50%;
  transform:translateX(-50%);
}

.pom:hover{
  transform:translateX(-50%) scale(1.09);
}

.forest{
  left:2%;
  top:50%;
  transform:translateY(-50%);
}

.forest:hover{
  transform:translateY(-50%) scale(1.09);
}

.alarm{
  right:2%;
  top:50%;
  transform:translateY(-50%);
}

.alarm:hover{
  transform:translateY(-50%) scale(1.09);
}

.planner{
  left:15%;
  top:5%;
}

.analytics{
  right:15%;
  top:5%;
}

.upgrades{
  left:50%;
  top:1%;
  transform:translateX(-50%);
}

.upgrades:hover{
  transform:translateX(-50%) scale(1.09);
}

/* ================= PANELS ================= */

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:23px;
  padding:23px;
  margin-top:22px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.panel-head h2{
  font-size:20px;
}

.panel-head p{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.close-btn{
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  width:38px;
  height:38px;
  border-radius:11px;
}

/* ================= POMODORO ================= */

.pomo-wrap{
  text-align:center;
}

.timer-ring{
  width:250px;
  height:250px;
  margin:15px auto;
  border-radius:50%;
  display:grid;
  place-items:center;

  background:
    radial-gradient(circle,#0d141e 64%,transparent 65%),
    conic-gradient(var(--blue) var(--progress,0%),#1d2937 0);

  box-shadow:0 0 50px rgba(75,156,255,.13);
}

.timer-inner strong{
  display:block;
  font-size:46px;
}

.timer-inner span{
  color:var(--muted);
  font-size:11px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--border);
  background:#162130;
  color:white;
  border-radius:11px;
  padding:11px 17px;
}

.btn.primary{
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  border:0;
}

.btn.green{
  background:rgba(53,212,154,.12);
  color:var(--green);
}

/* ================= FOREST ================= */

.forest-view{
  min-height:250px;
  border-radius:20px;
  border:1px solid var(--border);
  background:
    radial-gradient(circle at 50% 15%,rgba(53,212,154,.10),transparent 35%),
    #09100e;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.trees{
  font-size:55px;
  letter-spacing:8px;
  line-height:1.4;
  word-break:break-word;
  max-width:700px;
}

.forest-count{
  color:var(--green);
  font-weight:800;
  margin-top:15px;
}

/* ================= ALARMS ================= */

.alarm-form{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}

.input{
  width:100%;
  padding:12px 14px;
  border-radius:11px;
  border:1px solid var(--border);
  background:#080d14;
  color:white;
  outline:none;
}

.input:focus{
  border-color:var(--blue);
}

.alarm-list{
  margin-top:18px;
  display:grid;
  gap:9px;
}

.alarm-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:#0a1018;
  border:1px solid var(--border);
  border-radius:13px;
}

.alarm-time{
  font-size:21px;
  font-weight:800;
}

.alarm-label{
  color:var(--muted);
  font-size:11px;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  padding:17px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#0b1119;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-top:7px;
}

.stat span{
  color:var(--muted);
  font-size:10px;
}

/* ================= UPGRADES ================= */

.upgrade-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.upgrade{
  padding:18px;
  border-radius:17px;
  border:1px solid var(--border);
  background:#0b1119;
}

.upgrade-icon{
  font-size:28px;
}

.upgrade h3{
  margin-top:10px;
  font-size:14px;
}

.upgrade p{
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  margin:5px 0 13px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  background:#121c29;
  border:1px solid var(--border);
  color:white;
  padding:13px 18px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:5000;
  font-size:12px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topbar{
    padding:0 13px;
  }

  .main{
    width:94%;
  }

  .hero h1{
    font-size:25px;
  }

  .orbit{
    width:96vw;
    height:96vw;
    min-height:430px;
    max-height:620px;
  }

  .core{
    width:125px;
    height:125px;
  }

  .core-logo{
    font-size:21px;
  }

  .core-name{
    font-size:6px;
  }

  .core-level{
    font-size:8px;
  }

  .orbit-card{
    width:96px;
    height:96px;
  }

  .orbit-card .icon{
    font-size:22px;
  }

  .orbit-card strong{
    font-size:8px;
  }

  .orbit-card span{
    font-size:6px;
  }

  .pom{
    bottom:0;
  }

  .forest{
    left:0;
  }

  .alarm{
    right:0;
  }

  .planner{
    left:3%;
    top:5%;
  }

  .analytics{
    right:3%;
    top:5%;
  }

  .upgrades{
    top:0;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .upgrade-grid{
    grid-template-columns:1fr;
  }

  .alarm-form{
    grid-template-columns:1fr;
  }

  .timer-ring{
    width:210px;
    height:210px;
  }

  .timer-inner strong{
    font-size:38px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="brand-logo">BM</div>

    <div class="brand-text">
      BEYOND MASTERY
      <small>FOCUS • LEARN • MASTER</small>
    </div>
  </div>

  <div class="top-actions">
    <button class="top-btn" onclick="openPanel('analytics')">📊</button>
    <button class="top-btn" onclick="toggleSound()">🔊</button>
  </div>

</header>


<main class="main">

  <section class="hero">

    <h1>
      Welcome to <span>Beyond Mastery</span>
    </h1>

    <p>
      Your personal study universe. Focus deeply, build your forest,
      track your progress and master your goals.
    </p>

  </section>


  <!-- ================= FOCUS ORBIT ================= -->

  <div class="orbit-header">

    <h2>Focus Orbit</h2>

    <p>
      Everything you need to master your day
    </p>

  </div>


  <section class="orbit">

    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>


    <!-- CENTER -->

    <div class="core">

      <div class="core-logo">
        BM
      </div>

      <div class="core-name">
        BEYOND MASTERY
      </div>

      <div class="core-level">
        LEVEL <span id="level">1</span>
        •
        <span id="xp">0</span> XP
      </div>

    </div>


    <!-- POMODORO -->

    <button class="orbit-card pom" onclick="openPanel('pomodoro')">

      <div class="icon">
        ⏱️
      </div>

      <strong>POMODORO</strong>

      <span>
        25:00 Focus
      </span>

    </button>


    <!-- FOREST -->

    <button class="orbit-card forest" onclick="openPanel('forest')">

      <div class="icon">
        🌲
      </div>

      <strong>FOCUS FOREST</strong>

      <span>
        <b id="treeSmall">0</b> Trees
      </span>

    </button>


    <!-- ALARM -->

    <button class="orbit-card alarm" onclick="openPanel('alarms')">

      <div class="icon">
        ⏰
      </div>

      <strong>ALARMS</strong>

      <span>
        <b id="alarmSmall">0</b> Reminders
      </span>

    </button>


    <!-- PLANNER -->

    <button class="orbit-card planner" onclick="openPanel('planner')">

      <div class="icon">
        📅
      </div>

      <strong>PLANNER</strong>

      <span>
        Daily Tasks
      </span>

    </button>


    <!-- ANALYTICS -->

    <button class="orbit-card analytics" onclick="openPanel('analytics')">

      <div class="icon">
        📊
      </div>

      <strong>ANALYTICS</strong>

      <span>
        Your Progress
      </span>

    </button>


    <!-- UPGRADES -->

    <button class="orbit-card upgrades" onclick="openPanel('upgrades')">

      <div class="icon">
        ⚡
      </div>

      <strong>UPGRADES</strong>

      <span>
        Level Up
      </span>

    </button>

  </section>


  <!-- ================= DYNAMIC PANEL ================= -->

  <section id="panel" class="panel hidden">

    <div class="panel-head">

      <div>
        <h2 id="panelTitle"></h2>
        <p id="panelSubtitle"></p>
      </div>

      <button class="close-btn" onclick="closePanel()">
        ✕
      </button>

    </div>

    <div id="panelContent"></div>

  </section>


</main>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   BM DATA
===================================================== */

let data = JSON.parse(
  localStorage.getItem("BM_DATA")
) || {

  xp:0,

  trees:0,

  completedSessions:0,

  focusMinutes:0,

  streak:0,

  coins:0,

  alarms:[],

  tasks:[],

  sound:true

};


function save(){

  localStorage.setItem(
    "BM_DATA",
    JSON.stringify(data)
  );

  updateUI();

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

  const level =
    Math.floor(data.xp / 100) + 1;

  document.getElementById("level")
    .textContent = level;

  document.getElementById("xp")
    .textContent = data.xp;

  document.getElementById("treeSmall")
    .textContent = data.trees;

  document.getElementById("alarmSmall")
    .textContent = data.alarms.length;

}


updateUI();


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(message){

  const box =
    document.getElementById("toast");

  box.textContent = message;

  box.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => box.classList.remove("show"),
      2500
    );

}


/* =====================================================
   PANEL
===================================================== */

function openPanel(type){

  const panel =
    document.getElementById("panel");

  panel.classList.remove("hidden");

  if(type==="pomodoro")
    renderPomodoro();

  if(type==="forest")
    renderForest();

  if(type==="alarms")
    renderAlarms();

  if(type==="planner")
    renderPlanner();

  if(type==="analytics")
    renderAnalytics();

  if(type==="upgrades")
    renderUpgrades();

  panel.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


function closePanel(){

  document
    .getElementById("panel")
    .classList.add("hidden");

}


/* =====================================================
   POMODORO
===================================================== */

let pomoTime = 25 * 60;

let pomoRunning = false;

let pomoInterval = null;

function renderPomodoro(){

  document.getElementById("panelTitle")
    .textContent = "Pomodoro Focus";

  document.getElementById("panelSubtitle")
    .textContent =
    "25 minutes of deep focus";

  document.getElementById("panelContent")
    .innerHTML = `

      <div class="pomo-wrap">

        <div class="timer-ring"
             id="timerRing">

          <div class="timer-inner">

            <strong id="timer">
              25:00
            </strong>

            <span>
              FOCUS SESSION
            </span>

          </div>

        </div>

        <div class="controls">

          <button
            class="btn primary"
            onclick="togglePomo()"
          >
            <span id="pomoBtn">
              Start Focus
            </span>
          </button>

          <button
            class="btn"
            onclick="resetPomo()"
          >
            Reset
          </button>

          <button
            class="btn green"
            onclick="completePomo()"
          >
            Complete
          </button>

        </div>

      </div>

    `;

  updateTimer();

}


function togglePomo(){

  if(pomoRunning){

    clearInterval(pomoInterval);

    pomoRunning=false;

    document.getElementById("pomoBtn")
      .textContent="Resume";

    return;

  }

  pomoRunning=true;

  document.getElementById("pomoBtn")
    .textContent="Pause";

  pomoInterval=setInterval(
    tick,
    1000
  );

}


function tick(){

  if(pomoTime<=0){

    completePomo();

    return;

  }

  pomoTime--;

  updateTimer();

}


function updateTimer(){

  const min =
    Math.floor(pomoTime/60)
      .toString()
      .padStart(2,"0");

  const sec =
    (pomoTime%60)
      .toString()
      .padStart(2,"0");

  const timer =
    document.getElementById("timer");

  if(timer)
    timer.textContent =
      `${min}:${sec}`;

  const progress =
    ((25*60-pomoTime)/(25*60))*100;

  const ring =
    document.getElementById("timerRing");

  if(ring)
    ring.style.setProperty(
      "--progress",
      progress+"%"
    );

}


function resetPomo(){

  clearInterval(pomoInterval);

  pomoRunning=false;

  pomoTime=25*60;

  renderPomodoro();

}


function completePomo(){

  clearInterval(pomoInterval);

  pomoRunning=false;

  pomoTime=25*60;

  data.trees++;

  data.xp+=25;

  data.coins+=10;

  data.completedSessions++;

  data.focusMinutes+=25;

  save();

  toast(
    "🌳 Focus complete! New tree added."
  );

  renderPomodoro();

}


/* =====================================================
   FOREST
===================================================== */

function renderForest(){

  document.getElementById("panelTitle")
    .textContent="Focus Forest";

  document.getElementById("panelSubtitle")
    .textContent=
    "Every completed focus session grows your forest";

  let trees="";

  const count =
    Math.min(data.trees,60);

  for(let i=0;i<count;i++){

    trees+="🌲 ";

  }

  if(!trees)
    trees="🌱";

  document.getElementById("panelContent")
    .innerHTML=`

      <div class="forest-view">

        <div class="trees">
          ${trees}
        </div>

        <div class="forest-count">
          ${data.trees} Trees Grown
        </div>

        <p style="
          color:var(--muted);
          font-size:11px;
          margin-top:7px;
        ">
          Complete Pomodoro sessions
          to grow your forest.
        </p>

      </div>

    `;

}


/* =====================================================
   ALARMS
===================================================== */

function renderAlarms(){

  document.getElementById("panelTitle")
    .textContent="Alarms & Reminders";

  document.getElementById("panelSubtitle")
    .textContent=
    "Never miss your study time";

  let rows="";

  data.alarms.forEach(
    (alarm,index)=>{

      rows+=`

        <div class="alarm-row">

          <div>

            <div class="alarm-time">
              ${alarm.time}
            </div>

            <div class="alarm-label">
              ${alarm.label}
            </div>

          </div>

          <button
            class="btn"
            onclick="deleteAlarm(${index})"
          >
            Delete
          </button>

        </div>

      `;

    }
  );

  document.getElementById("panelContent")
    .innerHTML=`

      <div class="alarm-form">

        <input
          class="input"
          type="time"
          id="alarmTime"
        >

        <input
          class="input"
          type="text"
          id="alarmLabel"
          placeholder="Study reminder"
        >

        <button
          class="btn primary"
          onclick="addAlarm()"
        >
          Add Alarm
        </button>

      </div>

      <div class="alarm-list">

        ${
          rows ||
          `<div style="
            color:var(--muted);
            font-size:12px;
            padding:15px;
          ">
            No alarms yet.
          </div>`
        }

      </div>

    `;

}


function addAlarm(){

  const time =
    document.getElementById("alarmTime")
      .value;

  const label =
    document.getElementById("alarmLabel")
      .value
      .trim() || "Study Time";

  if(!time){

    toast("⏰ Select a time first.");

    return;

  }

  data.alarms.push({
    time,
    label
  });

  data.alarms.sort(
    (a,b)=>
      a.time.localeCompare(b.time)
  );

  save();

  toast("⏰ Alarm added.");

  renderAlarms();

}


function deleteAlarm(index){

  data.alarms.splice(
    index,
    1
  );

  save();

  renderAlarms();

}


/* =====================================================
   ALARM CHECKER
===================================================== */

setInterval(()=>{

  const now =
    new Date();

  const time =
    now.toTimeString()
      .slice(0,5);

  data.alarms.forEach(
    alarm=>{

      if(alarm.time===time){

        toast(
          "⏰ "+alarm.label
        );

        if(data.sound &&
           "Notification" in window){

          if(
            Notification.permission==="granted"
          ){

            new Notification(
              "Beyond Mastery",
              {
                body:alarm.label
              }
            );

          }

        }

      }

    }
  );

},60000);


/* =====================================================
   PLANNER
===================================================== */

function renderPlanner(){

  document.getElementById("panelTitle")
    .textContent="Daily Planner";

  document.getElementById("panelSubtitle")
    .textContent=
    "Plan your study day";

  let tasks="";

  data.tasks.forEach(
    (task,index)=>{

      tasks+=`

        <div class="alarm-row">

          <div>

            <strong
              style="
                text-decoration:
                ${task.done
                  ?"line-through"
                  :"none"};
              "
            >
              ${escapeHTML(task.text)}
            </strong>

          </div>

          <div style="
            display:flex;
            gap:6px;
          ">

            <button
              class="btn"
              onclick="toggleTask(${index})"
            >
              ${task.done?"↩":"✓"}
            </button>

            <button
              class="btn"
              onclick="deleteTask(${index})"
            >
              ×
            </button>

          </div>

        </div>

      `;

    }
  );

  document.getElementById("panelContent")
    .innerHTML=`

      <div style="
        display:flex;
        gap:9px;
      ">

        <input
          class="input"
          id="taskInput"
          placeholder="Add today's task..."
        >

        <button
          class="btn primary"
          onclick="addTask()"
        >
          Add
        </button>

      </div>

      <div class="alarm-list">
        ${tasks}
      </div>

    `;

}


function addTask(){

  const input =
    document.getElementById("taskInput");

  const text =
    input.value.trim();

  if(!text){

    toast("Write a task first.");

    return;

  }

  data.tasks.push({
    text,
    done:false
  });

  save();

  renderPlanner();

}


function toggleTask(index){

  data.tasks[index].done =
    !data.tasks[index].done;

  if(data.tasks[index].done){

    data.xp+=5;

    data.coins+=2;

  }

  save();

  renderPlanner();

}


function deleteTask(index){

  data.tasks.splice(
    index,
    1
  );

  save();

  renderPlanner();

}


/* =====================================================
   ANALYTICS

          </span>

          </span>
        </div>

        <div class="stat">

            ${data.streak}

/* =====================================================
   UPGRADES
===================================================== */

function renderUpgrades(){

  document.getElementById("panelTitle")
    .textContent="BM Upgrades";

  document.getElementById("panelSubtitle")
    .textContent=
    "Use coins to unlock your productivity universe";

  document.getElementById("panelContent")
    .innerHTML=`

      <div style="
        padding:14px;
        margin-bottom:15px;
        border-radius:15px;
        background:#0a1018;
        border:1px solid var(--border);
      ">

        🪙 Coins:
        <strong>
          ${data.coins}
        </strong>

      </div>

      <div class="upgrade-grid">

        ${upgradeCard(
          "🌲",
          "Forest Expansion",
          "Grow more beautiful forest trees.",
          25
        )}

        ${upgradeCard(
          "🎨",
          "Dark Premium Theme",
          "Unlock a deeper BM visual theme.",
          50
        )}

        ${upgradeCard(
          "🔊",
          "Focus Sounds",
          "Unlock more focus sound modes.",
          75
        )}

        ${upgradeCard(
          "✨",
          "Golden Tree",
          "Unlock a special golden tree.",
          100
        )}

        ${upgradeCard(
          "🏆",
          "Master Badge",
          "Show your long-term focus achievement.",
          150
        )}

        ${upgradeCard(
          "🌌",
          "Galaxy Forest",
          "Unlock a futuristic forest environment.",
          250
        )}

      </div>

    `;

}


function upgradeCard(
  icon,
  title,
  description,
  price
){

  return `

    <div class="upgrade">

      <div class="upgrade-icon">
        ${icon}
      </div>

      <h3>
        ${title}
      </h3>

      <p>
        ${description}
      </p>

      <button
        class="btn primary"
        onclick="buyUpgrade(
          '${title}',
          ${price}
        )"
      >
        🪙 ${price} Coins
      </button>

    </div>

  `;

}


function buyUpgrade(
  name,
  price
){

  if(data.coins<price){

    toast(
      "Not enough coins yet."
    );

    return;

  }

  data.coins-=price;

  save();

  toast(
    "⚡ "+name+" unlocked!"
  );

  renderUpgrades();

}


/* =====================================================
   SOUND
===================================================== */

function toggleSound(){

  data.sound=!data.sound;

  save();

  toast(
    data.sound
      ?"🔊 Sound enabled"
      :"🔇 Sound disabled"
  );

}


/* =====================================================
   NOTIFICATION PERMISSION
===================================================== */

if(
  "Notification" in window &&
  Notification.permission==="default"
){

  Notification.requestPermission();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   INITIAL
===================================================== */

updateUI();

</script>
